    <main>
        <input type="text" placeholder="Search...">
        
        <div class="image-slider">
            <img src="./images/logo.png" alt="">
        </div>
        <div class="container">
            
            <div class="card">
                <img src="images/div doc.jpg" alt="...">
                <div class="card-body">
                    <a href="#">
                        <h5 class="card-title">Find Doctors</h5>
                    </a>
                </div>
            </div>
    
            <div class="card">
                <img src="images/div video.png" alt="...">
                <div class="card-body">
                    <a href="#">
                        <h5 class="card-title">Video Conference</h5>
                    </a>
                </div>
            </div>
    
            <div class="card">
                <img src="images/div med.jpg" alt="...">
                <div class="card-body">
                    <a href="#">
                        <h5 class="card-title">Medicines</h5>
                    </a>
                </div>
            </div>
    
            <div class="card">
                <img src="images/div lab.png" alt="...">
                <div class="card-body">
                    <a href="#">
                        <h5 class="card-title">Lab Tests</h5>
                    </a>
                </div>
            </div>
    
            <div class="card">
                <img src="images/div ambulance.png" alt="...">
                <div class="card-body">
                    <a href="#">
                        <h5 class="card-title">Other Services</h5>
                    </a>

    <footer>
        <div class="footer-text">
            LifeSnap
        </div>
        <b>Copyright &copy; 2023, LifeSnap. All rights reserved</b>
    </footer>
</body>

<script>
let slideIndex = [1,1];
/* Class the members of each slideshow group with different CSS classes */
let slideId = ["mySlides1", "mySlides2"]
showSlides(1, 0);
showSlides(1, 1);

function plusSlides(n, no) {
  showSlides(slideIndex[no] += n, no);
}

function showSlides(n, no) {
  let i;
  let x = document.getElementsByClassName(slideId[no]);
  if (n > x.length) {slideIndex[no] = 1}
  if (n < 1) {slideIndex[no] = x.length}
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  x[slideIndex[no]-1].style.display = "block";
}
</script>

</html>
